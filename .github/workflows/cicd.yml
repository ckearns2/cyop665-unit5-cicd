
name: CYOP 665 Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile application
        run: python -m py_compile hello.py

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Install Bandit security scanner
        run: python -m pip install bandit

      - name: Run security scan
        run: bandit -r hello.py

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Package application
        run: zip hello-world.zip hello.py

      - name: Publish deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world
          path: hello-world.zip
